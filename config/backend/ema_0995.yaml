experiment:
  name: evidence_opd_qasper
  seed: 42
  strict_on_policy: true
models:
  student: ${oc.env:SFT_MODEL_PATH,outputs/checkpoints/sft_4b_seed42/best}
  student_tokenizer: ${oc.env:STUDENT_MODEL_PATH,models/Qwen3-4B-Base}
  teacher: ${oc.env:TEACHER_MODEL_PATH,models/Qwen3-30B-A3B-Instruct-2507}
  teacher_tokenizer: ${oc.env:TEACHER_MODEL_PATH,models/Qwen3-30B-A3B-Instruct-2507}
  ema_initial_teacher: ${oc.env:EMA_MODEL_PATH,models/Qwen3-4B}
  ema_tokenizer: ${oc.env:EMA_MODEL_PATH,models/Qwen3-4B}
  trust_remote_code: false
data:
  raw_dir: data/baseline/train
  processed_dir: data/cache
  tokenized_path: ${oc.env:BASELINE_CACHE_PATH,data/cache/baseline_train.pt}
  batch_manifest: ${oc.env:BASELINE_BATCH_MANIFEST,data/cache/baseline_batches.jsonl}
  split: train
  max_prompt_tokens: 8192
  max_response_tokens: 256
  length_buckets:
  - 2048
  - 4096
  - 6144
  - 8192
  student_max_batch_tokens: 12000
  teacher_max_batch_tokens: 18000
  dataloader_workers: 4
prompt:
  system: You answer questions about a scientific paper. Use only the supplied paper,
    be precise, and finish with a concise answer. Do not mention hidden evidence annotations
    or privileged information.
  enable_thinking: false
rollout:
  backend: transformers
  do_sample: true
  temperature: 0.8
  top_p: 0.95
  top_k: 0
  use_cache: true
training:
  epochs: 1
  max_optimizer_steps: null
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-06
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  fused_adamw: false
  gradient_checkpointing: true
  model_dtype: bf16
  kl_dtype: fp32
teacher:
  backend: transformers_tp
  tp_size: 2
  ranks:
  - 1
  - 2
  logical_ranks:
  - 1
  - 2
  frozen: true
  response_only_logits: true
  attention_backend: sdpa
communication:
  backend: nccl
  logits_dtype: bf16
  kl_chunk_tokens: 32
  cpu_staging: false
pipeline:
  enabled: false
  max_queue_size: 2
  enforce_policy_version: true
  note: Enable only after the Phase-2 correctness gate; synchronous v1 is the saved
    default.
vllm:
  student_rollout:
    enabled: false
  teacher_forced_prefix:
    enabled: false
checkpoint:
  output_root: outputs
  final_only: false
  weights_only: true
  milestone_fractions:
  - 0.33
  - 0.66
  project_budget_bytes: 274877906944
  minimum_filesystem_free_bytes: 10737418240
  expected_student_checkpoint_bytes: 8056522173
  save_tokenizer: true
evaluation:
  enabled: false
run:
  name: 08_ema_0995
method:
  family: ema_teacher
  divergence: reverse_kl
  temperature: 1.0
  entropy_fraction: 1.0
  teacher_prompt: normal
  ema_decay: 0.995
