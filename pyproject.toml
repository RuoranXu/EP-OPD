[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ep-opd"
version = "0.1.0"
description = "Exact evidence-paired on-policy distillation with VERL worker orchestration"
requires-python = ">=3.10"
dependencies = [
  "verl==0.5.0", "ray>=2.10,<2.49", "hydra-core>=1.3,<1.4",
  "torch==2.6.0", "transformers==4.57.6", "accelerate==1.10.1",
  "huggingface-hub==0.36.2", "tokenizers==0.22.2", "safetensors>=0.4.5",
  "numpy>=1.24", "PyYAML>=6", "vllm==0.8.5; sys_platform == 'linux'"
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["evidence_opd*", "trainer*", "workers*", "test*"]
exclude = ["validation*"]
